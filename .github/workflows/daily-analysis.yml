name: Daily Japan 225 Analysis

on:
  schedule:
    # 30 minutes before Japan cash open (09:00 JST ~ 00:00 UTC, previous day)
    - cron: '30 23 * * 0-4'  # Sun–Thu 23:30 UTC

    # 30 minutes after Japan cash open
    - cron: '30 0 * * 1-5'   # Mon–Fri 00:30 UTC

    # 30 minutes before Japan cash close (15:00 JST ~ 06:00 UTC)
    - cron: '30 5 * * 1-5'   # Mon–Fri 05:30 UTC

    # 30 minutes after Japan cash close
    - cron: '30 6 * * 1-5'   # Mon–Fri 06:30 UTC

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      execute_orders:
        description: 'Execute orders (true/false)'
        required: false
        default: 'true'

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment: dev  # ← Add this line to use dev environment
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install uv
        run: |
          pip install uv
          echo "✓ uv installed"
      
      - name: Install dependencies
        run: |
          uv sync
          echo "✓ Dependencies installed"
      
      - name: Run Japan 225 analysis
        env:
          # City Index API
          CITYINDEX_USERNAME: ${{ secrets.CITYINDEX_USERNAME }}
          CITYINDEX_PASSWORD: ${{ secrets.CITYINDEX_PASSWORD }}
          CITYINDEX_APPKEY: ${{ secrets.CITYINDEX_APPKEY }}
          
          # Pinecone Vector DB
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: japan225-news-vectors
          PINECONE_ENVIRONMENT: us-east-1-aws
          
          # OpenAI Embeddings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
          # Google Gemini LLM
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          GOOGLE_GEMINI_MODEL: gemini-3-flash-preview
          
          # Notion Integration
          NOTION_SECOND_BRAIN_TOKEN: ${{ secrets.NOTION_SECOND_BRAIN_TOKEN }}
          NOTION_SECOND_BRAIN_DB_ID: ${{ secrets.NOTION_SECOND_BRAIN_DB_ID }}
          
          # Financial Modeling Prep (optional)
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          
          # Trading execution control
          EXECUTE_ORDERS: "true"
          EXECUTE_ALERTS: "true"
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M)
          echo "🚀 Running Japan 225 analysis at $TIMESTAMP"
          
          # Create temporary .env file for uv
          cat > .env.github << EOF
          CITYINDEX_USERNAME=${CITYINDEX_USERNAME}
          CITYINDEX_PASSWORD=${CITYINDEX_PASSWORD}
          CITYINDEX_APPKEY=${CITYINDEX_APPKEY}
          PINECONE_API_KEY=${PINECONE_API_KEY}
          PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
          PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
          GOOGLE_GEMINI_MODEL=${GOOGLE_GEMINI_MODEL}
          NOTION_SECOND_BRAIN_TOKEN=${NOTION_SECOND_BRAIN_TOKEN}
          NOTION_SECOND_BRAIN_DB_ID=${NOTION_SECOND_BRAIN_DB_ID}
          FMP_API_KEY=${FMP_API_KEY}
          EXECUTE_ORDERS=${EXECUTE_ORDERS}
          EOF
          
          # Export variables and run
          set -a
          source .env.github
          set +a
          
          uv run python janestreet.py > janestreet_${TIMESTAMP}.json
          
          # Clean up
          rm .env.github
          
          echo "✓ Analysis complete"
          
          # Show summary
          echo "📊 Trading Recommendations:"
          cat janestreet_${TIMESTAMP}.json | jq -r '.trading_recommendations | 
            "Orders: \(.count // 0)\nDry Run: \(.dry_run)\n"'
      
      - name: Sync Notion feedback to Pinecone
        if: success()
        env:
          NOTION_SECOND_BRAIN_TOKEN: ${{ secrets.NOTION_SECOND_BRAIN_TOKEN }}
          NOTION_SECOND_BRAIN_DB_ID: ${{ secrets.NOTION_SECOND_BRAIN_DB_ID }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          echo "🔄 Syncing feedback from Notion to Pinecone"
          uv run python sync_notion_feedback_complete.py
          echo "✓ Feedback synced"
      
      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results-${{ github.run_number }}
          path: janestreet_*.json
          retention-days: 30
      
      - name: Comment on commit (if feedback synced)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readdirSync('.').filter(f => f.startsWith('janestreet_'));
            
            if (files.length > 0) {
              const data = JSON.parse(fs.readFileSync(files[0], 'utf8'));
              const orders = data.trading_recommendations?.orders || [];
              const dryRun = data.trading_recommendations?.dry_run !== false;
              
              let comment = `## 📊 Japan 225 Analysis Complete\n\n`;
              comment += `**Time:** ${data.generated_at_utc}\n`;
              comment += `**Orders Generated:** ${orders.length}\n`;
              comment += `**Dry Run:** ${dryRun ? '✅ Yes (safe)' : '⚠️ No (LIVE)'}\n\n`;
              
              if (orders.length > 0) {
                comment += `### Orders:\n`;
                orders.forEach((order, i) => {
                  comment += `${i+1}. **${order.Direction.toUpperCase()}** ${order.Quantity} @ ${order.TriggerPrice}\n`;
                });
              }
              
              comment += `\n[View full analysis artifact](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
              
              // Create an issue comment or discussion
              console.log(comment);
            }
