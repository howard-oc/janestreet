name: Weekly Analysis Review

on:
  # Run every Sunday at 10 AM UTC
  schedule:
    - cron: '0 10 * * 0'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    environment: dev  # Use dev environment secrets
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install uv
          uv sync
      
      - name: Generate weekly report
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "📊 Generating weekly analysis report"
          
          # Query last 7 days of analyses
          uv run python query_historical_analysis.py --days 7 --compare > weekly_report.txt
          
          echo "✓ Weekly report generated"
          cat weekly_report.txt
      
      - name: Upload weekly report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_number }}
          path: weekly_report.txt
          retention-days: 90
      
      - name: Create GitHub Issue with summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('weekly_report.txt', 'utf8');
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly Analysis Review - ${new Date().toISOString().split('T')[0]}`,
              body: `## Weekly Japan 225 Trading Review\n\n\`\`\`\n${report}\n\`\`\`\n\n---\n*Generated automatically by GitHub Actions*`,
              labels: ['analysis', 'weekly-review']
            });
            
            console.log(`Created issue #${issue.data.number}`);
